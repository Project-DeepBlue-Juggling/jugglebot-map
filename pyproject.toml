[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "jugglebot-map"
version = "0.1.0"
description = "Viewer/editor for a Jugglebot checkout's project map (map/ items and plans)."
readme = "README.md"
license = { text = "MIT" }
# Developed and tested on Python 3.8 (the Jetson venv); the Pi runs 3.13 and the target is 3.11+.
requires-python = ">=3.8"
dependencies = [
    "fastapi>=0.100",
    "uvicorn>=0.24",
    "pydantic>=2",
    "pyyaml>=5.4",
    "watchdog>=3",
]

[project.optional-dependencies]
test = ["pytest>=7", "httpx>=0.24"]

[project.scripts]
jugglebot-map = "server.cli:main"

[tool.setuptools]
packages = ["server"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
