<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>"
    />
    <title>Jugglebot map</title>
    <script>
      // Pre-mount FOUC mitigation (ADR 0017): the map is dark by default; the
      // ThemeProvider removes the class only for an explicit 'light' choice.
      document.documentElement.classList.add('dark');
      // GUI prefs persisted by src/prefs/guiPrefs.ts: apply before first paint.
      try {
        var gp = JSON.parse(localStorage.getItem('jugglebot-gui-prefs'));
        if (gp && gp.theme === 'light') document.documentElement.classList.remove('dark');
        if (gp && Number.isInteger(gp.fontSize)) {
          var fs = Math.min(22, Math.max(10, gp.fontSize));
          document.documentElement.style.setProperty('--app-zoom', String(fs / 14));
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
