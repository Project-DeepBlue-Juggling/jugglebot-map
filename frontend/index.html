<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="icon"
      href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌳</text></svg>"
    />
    <title>Jugglebot map</title>
    <script>
      // Pre-mount FOUC mitigation (ADR 0017). Match the OS preference until
      // the React ThemeProvider takes over with the user's stored choice.
      // No localStorage — CLAUDE.md §Never forbids it. If the persisted
      // preference matches the OS, there is no visible transition at all.
      (function () {
        try {
          if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
            document.documentElement.classList.add('dark');
          }
        } catch (_) {
          // matchMedia missing in obscure environments — keep light default.
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
