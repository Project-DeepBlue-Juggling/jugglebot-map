name: ci
on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # mapkit lives in Jugglebot: clone it shallowly so pytest stops skipping.
      - run: git clone --depth 1 https://github.com/Project-DeepBlue-Juggling/Jugglebot.git /tmp/jb
      - run: pip install -e .[test]
      - run: MAPKIT_SRC=/tmp/jb pytest -q
      - run: npm ci
        working-directory: frontend
      # Starts the real server on a temp copy of the fixture repo and parses every GET with the zod schemas.
      - run: MAPKIT_SRC=/tmp/jb bash scripts/contract_check.sh

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # hashFiles() is not allowed in a job-level `if`, so the seed check is a step:
      # until frontend/package.json exists every later step is skipped and the job passes.
      - id: seeded
        run: if [ -f package.json ]; then echo "yes=true" >> "$GITHUB_OUTPUT"; else echo "yes=false" >> "$GITHUB_OUTPUT"; echo "frontend not seeded yet - skipping"; fi
      - if: steps.seeded.outputs.yes == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - if: steps.seeded.outputs.yes == 'true'
        run: npm ci
      - if: steps.seeded.outputs.yes == 'true'
        run: npm run lint
      - if: steps.seeded.outputs.yes == 'true'
        run: npm run typecheck
      - if: steps.seeded.outputs.yes == 'true'
        run: npm run test -- --run
      - if: steps.seeded.outputs.yes == 'true'
        run: npm run build

  no-upstream-name:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash scripts/check_no_upstream_name.sh
